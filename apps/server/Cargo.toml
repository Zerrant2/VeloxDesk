[package]
name = "veloxdesk-server"
description = "VeloxDesk self-hosted rendezvous + relay server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "veloxdesk-server"
path = "src/main.rs"

[dependencies]
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
veloxdesk-server-rendezvous = { workspace = true }
veloxdesk-server-relay = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "signal"] }

[lints]
workspace = true
