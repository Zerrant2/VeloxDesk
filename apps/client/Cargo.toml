[package]
name = "veloxdesk"
description = "VeloxDesk client and host application."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "veloxdesk"
path = "src/main.rs"

[features]
# Viewer network pipeline + `--host`. Needs transport/codec/crypto/service (M1 crates of
# net-worker, media-worker and sys-worker).
default = ["net"]
net = [
    "dep:veloxdesk-transport",
    "dep:veloxdesk-codec",
    "dep:veloxdesk-audio",
    "dep:veloxdesk-crypto",
    "dep:veloxdesk-service",
    "dep:veloxdesk-clipboard",
    "dep:veloxdesk-file-transfer",
    "dep:veloxdesk-tunnel",
    "dep:veloxdesk-terminal",
    "dep:crossbeam-channel",
]

[dependencies]
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
veloxdesk-recorder = { workspace = true }
veloxdesk-render = { workspace = true }
veloxdesk-ui = { workspace = true }
veloxdesk-transport = { workspace = true, optional = true }
veloxdesk-codec = { workspace = true, optional = true }
veloxdesk-audio = { workspace = true, optional = true }
veloxdesk-crypto = { workspace = true, optional = true }
veloxdesk-service = { workspace = true, optional = true }
veloxdesk-clipboard = { workspace = true, optional = true }
veloxdesk-file-transfer = { workspace = true, optional = true }
veloxdesk-tunnel = { workspace = true, optional = true }
veloxdesk-terminal = { workspace = true, optional = true }
winit = "0.30.13"
egui = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true, optional = true }
parking_lot = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_XboxController"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
