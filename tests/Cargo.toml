[package]
name = "veloxdesk-tests"
description = "Integration tests for the VeloxDesk workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["full"]
# Tests needing the M1 transport (QUIC + FEC) API.
net = []
# Host↔viewer session smoke test (needs transport + service + codec).
full = ["net"]

[dev-dependencies]
anyhow.workspace = true
bytes.workspace = true
egui = { workspace = true }
prost.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "time", "sync", "macros"] }
veloxdesk-benches = { path = "../benches" }
veloxdesk-audio = { workspace = true }
veloxdesk-clipboard = { workspace = true }
veloxdesk-codec = { workspace = true }
veloxdesk-core-traits = { workspace = true }
veloxdesk-crypto = { workspace = true }
veloxdesk-file-transfer = { workspace = true }
veloxdesk-protocol = { workspace = true }
veloxdesk-recorder = { workspace = true }
veloxdesk-render = { workspace = true }
veloxdesk-server-rendezvous = { workspace = true }
veloxdesk-server-relay = { workspace = true }
veloxdesk-service = { workspace = true }
veloxdesk-terminal = { workspace = true }
veloxdesk-transport = { workspace = true }
veloxdesk-tunnel = { workspace = true }
veloxdesk-ui = { workspace = true }
veloxdesk-virtual-display = { workspace = true }

[target."cfg(windows)".dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }

[[test]]
name = "transport_loss"
required-features = ["net"]

[[test]]
name = "session_smoke"
required-features = ["full"]

[[test]]
name = "m2_p2p_auth"
required-features = ["full"]

[[test]]
name = "m3_gaming"
required-features = ["full"]

[[test]]
name = "m4_rustdesk_parity"
required-features = ["full"]

[[test]]
name = "m5_unified_host"
required-features = ["full"]

[[test]]
name = "v030_host_security"
required-features = ["full"]

[[test]]
name = "v050_polish"
required-features = ["full"]

[[test]]
name = "v060_modes_settings"
required-features = ["full"]

[lints]
workspace = true
