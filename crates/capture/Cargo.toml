[package]
name = "veloxdesk-capture"
description = "Screen capture backends: DXGI/WGC (Windows), PipeWire/X11 (Linux), ScreenCaptureKit (macOS)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Linux: xdg-desktop-portal ScreenCast + PipeWire stream (Wayland). Needs libpipewire-0.3-dev
# and libclang at build time, so it is opt-in; the X11 SHM backend is always built on Linux.
pipewire = ["dep:pipewire", "dep:ashpd"]

[dependencies]
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_Performance", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["shm", "randr", "xfixes"] }
libc = "0.2"
pipewire = { version = "0.10", optional = true }
ashpd = { version = "0.14", optional = true, default-features = false, features = ["tokio"] }
