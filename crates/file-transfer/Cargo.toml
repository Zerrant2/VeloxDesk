[package]
name = "veloxdesk-file-transfer"
description = "Chunked, resumable, zstd-compressed file transfer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
veloxdesk-crypto = { workspace = true }
veloxdesk-transport = { workspace = true }

[lints]
workspace = true
