[package]
name = "veloxdesk-terminal"
description = "Remote terminal via PTY / ConPTY."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tracing.workspace = true
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
veloxdesk-transport = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-trait.workspace = true

[lints]
workspace = true
