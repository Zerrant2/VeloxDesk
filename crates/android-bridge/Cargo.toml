[package]
name = "veloxdesk-android-bridge"
description = "VeloxDesk Android viewer core (QUIC/P2P/Relay, E2EE auth, FEC/ABR, Opus decode, JNI bridge)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "veloxdesk_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
veloxdesk-protocol = { workspace = true }
veloxdesk-core-traits = { workspace = true }
veloxdesk-crypto = { workspace = true }
veloxdesk-transport = { workspace = true }
veloxdesk-audio = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tracing = { workspace = true, features = ["log"] }
jni = "0.21"
ruzstd = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
veloxdesk-service = { workspace = true }
veloxdesk-codec = { workspace = true }
veloxdesk-clipboard = { workspace = true }
veloxdesk-server-rendezvous = { workspace = true }
veloxdesk-server-relay = { workspace = true }

[lints]
workspace = true
