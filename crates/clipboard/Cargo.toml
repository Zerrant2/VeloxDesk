[package]
name = "veloxdesk-clipboard"
description = "Bidirectional clipboard sync (text, images, files)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }
sha2 = "0.10.9"
arboard = "3.7.0"
png = "0.18.1"
zstd = "0.13"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
