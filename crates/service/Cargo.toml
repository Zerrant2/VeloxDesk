[package]
name = "veloxdesk-service"
description = "Host session pipeline, system service/daemon, IPC, config and CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
prost.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
toml = "0.9"
tracing.workspace = true
veloxdesk-audio = { workspace = true }
veloxdesk-capture = { workspace = true }
veloxdesk-clipboard = { workspace = true }
veloxdesk-codec = { workspace = true }
veloxdesk-core-traits = { workspace = true }
veloxdesk-crypto = { workspace = true }
veloxdesk-file-transfer = { workspace = true }
veloxdesk-input = { workspace = true }
veloxdesk-protocol = { workspace = true }
veloxdesk-terminal = { workspace = true }
veloxdesk-transport = { workspace = true }
veloxdesk-tunnel = { workspace = true }
veloxdesk-virtual-display = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
