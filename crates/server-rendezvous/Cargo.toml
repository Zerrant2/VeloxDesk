[package]
name = "veloxdesk-server-rendezvous"
description = "Rendezvous server: device registry, NAT hole-punch signalling."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
veloxdesk-crypto = { workspace = true }
prost = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
rand_core = { version = "0.6", features = ["getrandom"] }
socket2 = "0.6"

[lints]
workspace = true
