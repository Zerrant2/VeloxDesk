[package]
name = "veloxdesk-crypto"
description = "Device identity (Ed25519), TLS 1.3 cert/verifier, Argon2id passwords, auth proofs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
veloxdesk-core-traits = { workspace = true }
veloxdesk-protocol = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
x509-parser = "0.18"

[lints]
workspace = true
